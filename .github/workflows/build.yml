name: build

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PLUGIN_ID: codex-context-guard

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      native_builds: ${{ steps.classify.outputs.native_builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changes
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          native_builds=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            native_builds=false
            changed_files="$(git diff --name-only --no-renames "${BASE_SHA}" "${HEAD_SHA}")"
            while IFS= read -r path; do
              [[ -z "${path}" ]] && continue
              case "${path}" in
                *.md|docs/*) ;;
                *) native_builds=true; break ;;
              esac
            done <<< "${changed_files}"
          fi
          echo "native_builds=${native_builds}" >> "${GITHUB_OUTPUT}"

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: |
          CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test ./...
          go test ./.github/scripts
          go test ./.github/scripts/extract-release-notes
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: [changes, test]
    if: needs.changes.outputs.native_builds == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve release metadata
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "LIB_NAME=${PLUGIN_ID}.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
      - name: Build shared library
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "dist/${LIB_NAME}" .
          rm -f "dist/${PLUGIN_ID}.h"
      - name: Package
        run: >-
          go run ./.github/scripts/package-release.go
          -library "dist/${LIB_NAME}"
          -archive "${ARCHIVE_NAME}"
          -checksum "${ARCHIVE_NAME}.sha256"
          -manifest "${ARCHIVE_NAME}.artifact.json"
          -version "${VERSION}"
          -goos "${{ matrix.goos }}"
          -goarch "${{ matrix.goarch }}"
          -source-commit "${SOURCE_COMMIT}"
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            ${{ env.ARCHIVE_NAME }}.artifact.json

  build-windows-arm64:
    needs: [changes, test]
    if: needs.changes.outputs.native_builds == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve release metadata
        id: release
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_ID}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"
      - uses: go-cross/cgo-actions@d0b8f2f2d67923ce9a42d92a7ef0ed1ebd905f0a # v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: ${{ env.PLUGIN_ID }}.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release.outputs.version }}
      - name: Package
        run: |
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_ID}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_ID}.dll" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256" \
            -manifest "${ARCHIVE_NAME}.artifact.json" \
            -version "${VERSION}" \
            -goos "windows" \
            -goarch "arm64" \
            -source-commit "${SOURCE_COMMIT}"
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
            ${{ env.ARCHIVE_NAME }}.artifact.json

  ci:
    if: always()
    needs: [changes, test, build, build-windows-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_BUILDS: ${{ needs.changes.outputs.native_builds }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.build-windows-arm64.result }}
        run: |
          test "${CHANGES_RESULT}" = "success"
          test "${TEST_RESULT}" = "success"
          if [[ "${NATIVE_BUILDS}" == "true" ]]; then
            test "${BUILD_RESULT}" = "success"
            test "${WINDOWS_ARM64_RESULT}" = "success"
          else
            test "${BUILD_RESULT}" = "skipped"
            test "${WINDOWS_ARM64_RESULT}" = "skipped"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare and verify release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

          grep -Fqx "var pluginVersion = \"${VERSION}\"" main.go
          grep -Fqx "VERSION ?= ${VERSION}" Makefile
          jq -e --arg version "${VERSION}" \
            '.version == $version' marketplace/registry-entry.json >/dev/null

          go run ./.github/scripts/extract-release-notes \
            -changelog CHANGELOG.md \
            -version "${VERSION}" \
            -output dist/release-notes.md

          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq 6
          test "$(find dist -maxdepth 1 -type f -name '*.artifact.json' | wc -l)" -eq 6
          sort dist/*.sha256 > dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)

          jq -s 'sort_by(.goos, .goarch)' dist/*.artifact.json > dist/artifact-manifest.json
          jq -e --arg version "${VERSION}" --arg commit "$(git rev-parse HEAD)" \
            'length == 6 and
             all(.[]; .schema_version == 1 and .version == $version and .source_commit == $commit) and
             (map(.goos + "/" + .goarch) | unique | length) == 6 and
             (map(.archive) | unique | length) == 6' \
            dist/artifact-manifest.json >/dev/null
          while IFS= read -r manifest; do
            archive="$(jq -r '.archive' "${manifest}")"
            library="$(jq -r '.library' "${manifest}")"
            expected_archive="$(jq -r '.archive_sha256' "${manifest}")"
            expected_library="$(jq -r '.library_sha256' "${manifest}")"
            expected_size="$(jq -r '.library_size' "${manifest}")"
            test "$(sha256sum "dist/${archive}" | cut -d' ' -f1)" = "${expected_archive}"
            test "$(unzip -p "dist/${archive}" "${library}" | sha256sum | cut -d' ' -f1)" = "${expected_library}"
            test "$(unzip -p "dist/${archive}" "${library}" | wc -c)" -eq "${expected_size}"
          done < <(find dist -maxdepth 1 -type f -name '*.artifact.json' | sort)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/checksums.txt dist/artifact-manifest.json \
            --draft \
            --verify-tag \
            --title "Codex Context Guard ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            find dist -maxdepth 1 -type f -name '*.zip' -printf '%f\n'
            echo checksums.txt
            echo artifact-manifest.json
          } | sort > dist/expected-assets.txt

          gh release view "${GITHUB_REF_NAME}" \
            --json assets \
            --jq '.assets[].name' | sort > dist/actual-assets.txt

          diff -u dist/expected-assets.txt dist/actual-assets.txt
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
